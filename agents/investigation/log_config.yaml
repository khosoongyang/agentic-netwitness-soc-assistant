# =============================================================================
# [FYP-FILE] FILE OVERVIEW
# [FYP-SECTION] EXECUTABLE / BEHAVIOURAL CONFIGURATION
# =============================================================================
# File: soc_investigation_agent_revised/log_config.yaml
# Purpose: This file maps investigation log-source fields into canonical entity and timestamp names.
# Main functionality: Supplies runtime, dependency, security, workflow, or
#   playbook values consumed by the application/framework named below.
# Inputs: Maintainer-controlled configuration values; no live secret values
#   are documented or introduced by this overview.
# Outputs: Configuration read by the framework, installer, CI job, or Aegis
#   component; it does not independently execute a workflow stage.
# Workflow position: Supporting configuration for investigation.
# Important dependencies: The consuming application/framework and the exact
#   keys or steps declared in this file.
# Error and fallback behaviour: Invalid values fail in the consuming parser,
#   installer, workflow, or framework; fallback behaviour belongs to that caller.
# Key evaluator search terms: log_config.yaml, [FYP-CONFIG], [FYP-FILE].
# =============================================================================
# [FYP-CONFIG] Purpose: field-mapping rules for the investigation agent's log
# ingestion — maps each detected source type (Authentication, LogIndicators,
# Network, Endpoint) to the JSON paths used to extract username, hostname,
# and timestamp from raw alert data.
# Verified via Grep: loaded by soc_investigation_agent_revised/ingest_pipeline.py
# (CONFIG_PATH = .../log_config.yaml, parsed with yaml.safe_load at line ~12).
source_detection:
  - key: "authentication_details"
    source_type: "Authentication"
  - key: "log_indicators"
    source_type: "LogIndicators"
  - key: "network_indicators"
    source_type: "Network"
  - key: "endpoint_indicators"
    source_type: "Endpoint"

mappings:
  Authentication:
    username:
      - "authentication_details.attempted_target_user"
      - "log_indicators.target_user"
      - "exposed_credentials.username"
    hostname:
      - "log_indicators.computer_name"
      - "endpoint_indicators.host"
      - "network_indicators.source.hostname"
    timestamp:
      - "incident_details.timestamp"
  LogIndicators:
    username:
      - "log_indicators.target_user"
      - "authentication_details.attempted_target_user"
      - "exposed_credentials.username"
    hostname:
      - "log_indicators.computer_name"
      - "endpoint_indicators.host"
      - "network_indicators.source.hostname"
    timestamp:
      - "incident_details.timestamp"
  Network:
    username:
      - "log_indicators.target_user"
      - "authentication_details.attempted_target_user"
      - "exposed_credentials.username"
    hostname:
      - "log_indicators.computer_name"
      - "endpoint_indicators.host"
      - "network_indicators.source_host"
      - "network_indicators.source.hostname"
    timestamp:
      - "incident_details.timestamp"
  Endpoint:
    username:
      - "exposed_credentials.username"
      - "log_indicators.target_user"
      - "authentication_details.attempted_target_user"
    hostname:
      - "endpoint_indicators.host"
      - "log_indicators.computer_name"
      - "network_indicators.source.hostname"
    timestamp:
      - "incident_details.timestamp"
  Default:
    username:
      - "log_indicators.target_user"
      - "authentication_details.attempted_target_user"
      - "exposed_credentials.username"
    hostname:
      - "log_indicators.computer_name"
      - "endpoint_indicators.host"
      - "network_indicators.source_host"
      - "network_indicators.source.hostname"
    timestamp:
      - "incident_details.timestamp"
