<!-- [FYP-FILE] index.html — static page shell for the Aegis SOC Assistant dashboard
     (soc_reporting_agent/dashboard, plain JS/HTML/CSS front end). This file only supplies the
     fixed page skeleton (sidebar, header chrome, empty content/toast/modal containers) plus the
     script/style tags; every dynamic region below is (re)populated at runtime by app.js, mainly
     via its render()/renderNav()/header() functions matching the ids noted inline. This file has
     no workflow/approval logic of its own — see style.css for [FYP-STATE]/[FYP-APPROVAL]/
     [FYP-STAGE-LOCK] flagged classes and app.js for the underlying SOC pipeline state machine.
     File: soc_reporting_agent/dashboard/index.html
     Inputs: Browser load plus dynamic DOM content written by app.js.
     Outputs: Stable navigation, content, toast, and modal mount points.
     Workflow position: Browser bootstrap shell for the reporting dashboard.
     Important dependencies: app.js, style.css, browser DOM, external icon/font stylesheets.
     Key evaluator search terms: #nav, #content, #toast, #modal-backdrop, app.js. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic SOC Assistant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="soc-shell">
    <aside class="soc-sidebar">
      <!-- Static Aegis branding (full logo + collapsed-state icon); which image shows is toggled
           purely in CSS off body.collapsed (see .soc-logo-full/.soc-logo-icon in style.css). -->
      <div class="soc-brand" aria-label="Aegis product branding">
        <img src="/assets/aegis-logo-sidebar-hd.png" alt="Aegis" class="soc-logo-full" width="1920" height="624">
        <img src="/assets/aegis-icon.png" alt="" class="soc-logo-icon" aria-hidden="true">
      </div>
      <!-- [FYP] Left nav menu — populated by renderNav() in app.js from the `navGroups` config;
           also injects the nested My Tickets sub-routes (overview/agents/alerts/timeline/reports)
           for the currently selected/active case. -->
      <nav id="nav"></nav>
      <!-- Sidebar collapse toggle — click handler (app.js, near the bottom) flips `collapsed` on
           <body>; the resulting layout change (icon-only rail) is pure CSS, driven off that class. -->
      <button id="collapse-btn" class="soc-collapse"><i class="ti ti-chevrons-left"></i> <span>Collapse</span></button>
    </aside>

    <main class="soc-main">
      <header class="soc-header">
        <!-- [FYP] Page kicker/breadcrumb + heading — set by header() in app.js (differs for the
             Agent Workspace route vs. every other route via isAgentWorkspaceRoute()). -->
        <div id="header-left"></div>
        <div class="status-strip">
          <!-- NetWitness pill text/dot below is rewritten in place by header() using
               state.integrations.netwitness / state.lastNetWitnessSync (markup here is placeholder). -->
          <span><span class="dot ok"></span>NetWitness Connected</span>
          <span><span class="dot ok"></span>Threat Intel Active</span>
          <span><span class="dot ok"></span>LLM Available</span>
          <!-- Timestamp text populated by header() from state.lastNetWitnessSync.completed_at. -->
          <span>Last Sync: <strong id="last-sync">--</strong></span>
        </div>
        <button class="profile-menu" data-route="profile">
          <span class="avatar">SY</span>
          <span><strong>Soong Yang</strong><small>SOC Analyst</small></span>
          <i class="ti ti-chevron-down"></i>
        </button>
      </header>

      <!-- [FYP] Main routed content area — populated by render() in app.js, which swaps in the
           page handler for state.route (dashboard, ticketsPage, alertsPage, reportsForTicket,
           integrationsPage, etc. — see the `pages` map in render()). This is where the SOC
           workflow/agent panels and their [FYP-STATE]/[FYP-APPROVAL] styling actually render. -->
      <section id="content" class="soc-content"></section>
    </main>
  </div>

  <!-- [FYP-UI] Transient status toast — shown/hidden by toast() in app.js after most API calls
       (success/failure feedback); .toast.show plus a color class (green/red/yellow) makes it visible. -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- [FYP-UI] Generic modal shell, reused across the app for approvals, confirmations and detail
       previews. Opened/closed by openModal()/closeModal() in app.js, which set #modal-title,
       #modal-sub and inject caller-supplied HTML into #modal-body (display toggled on
       #modal-backdrop). Because content is raw injected HTML, this is also where per-workflow
       approval dialogs render (e.g. incident grouping approve/reject, SOC review confirmation). -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div>
          <h3 id="modal-title"></h3>
          <p id="modal-sub"></p>
        </div>
        <button class="icon-only" data-close-modal title="Close"><i class="ti ti-x"></i></button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
