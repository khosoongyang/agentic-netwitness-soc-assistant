# =============================================================================
# [FYP-FILE] FILE OVERVIEW
# [FYP-SECTION] EXECUTABLE / BEHAVIOURAL CONFIGURATION
# =============================================================================
# File: config.yaml
# Purpose: This file records triage and retrieval configuration values mirrored by the application.
# Main functionality: Supplies runtime, dependency, security, workflow, or
#   playbook values consumed by the application/framework named below.
# Inputs: Maintainer-controlled configuration values; no live secret values
#   are documented or introduced by this overview.
# Outputs: Configuration read by the framework, installer, CI job, or Aegis
#   component; it does not independently execute a workflow stage.
# Workflow position: Supporting configuration for SOC analysis support.
# Important dependencies: The consuming application/framework and the exact
#   keys or steps declared in this file.
# Error and fallback behaviour: Invalid values fail in the consuming parser,
#   installer, workflow, or framework; fallback behaviour belongs to that caller.
# Key evaluator search terms: config.yaml, [FYP-CONFIG], [FYP-FILE].
# =============================================================================
# [FYP-CONFIG] Purpose: reference configuration for the SOC Triage Agent —
# ChromaDB store, embedding model, foundation LLM, sklearn model paths,
# retrieval tuning, and the MITRE tactics / severity level enumerations.
# Verified via Grep: no app module loads this path at runtime (no
# yaml.safe_load("config.yaml") call found). Its triage.mitre_tactics and
# severity_levels values are instead mirrored as hardcoded constants in
# soc_triage_agent/soc_triage_agent.py (see MITRE_TACTICS ~line 275 and the
# CRITICAL/HIGH/MEDIUM/LOW literals used for classification/icons).
# ============================================================
#  SOC Triage Agent — Configuration
#  Edit this file to match your environment
# ============================================================

chromadb:
  host: "localhost"
  port: 8000
  # Set to null to use in-memory / persistent local path instead
  persist_directory: "./chroma_store"
  collection_name: "netwitness_logs"

embedding:
  # OpenAI embedding model, called via the API (OPENAI_API_KEY required)
  model: "text-embedding-3-small"
  # Alternatively for higher-fidelity embeddings:
  # model: "text-embedding-3-large"
  batch_size: 64
  chunk_size: 512          # characters per log chunk

foundation_ai:
  # OpenAI chat model used by the triage agent (see OPENAI_MODEL in .env)
  model_id: "gpt-4o-mini"
  max_new_tokens: 1024
  temperature: 0.1         # Low temp for deterministic triage
  top_p: 0.9

sklearn:
  # Paths where trained models are saved/loaded
  severity_model_path: "./models/severity_classifier.joblib"
  anomaly_model_path:  "./models/anomaly_detector.joblib"
  cluster_model_path:  "./models/log_clusterer.joblib"
  # IsolationForest contamination ratio (tune to your environment)
  anomaly_contamination: 0.05
  n_clusters: 8            # K-Means clusters for attack-type grouping

retrieval:
  top_k: 10                # How many similar logs to pull from ChromaDB
  relevance_threshold: 0.4 # Cosine similarity cutoff

triage:
  # MITRE ATT&CK Tactic categories the agent classifies into
  mitre_tactics:
    - "Initial Access"
    - "Execution"
    - "Persistence"
    - "Privilege Escalation"
    - "Defense Evasion"
    - "Credential Access"
    - "Discovery"
    - "Lateral Movement"
    - "Collection"
    - "Exfiltration"
    - "Command and Control"
    - "Impact"
  severity_levels:
    - "CRITICAL"
    - "HIGH"
    - "MEDIUM"
    - "LOW"
    - "INFORMATIONAL"
