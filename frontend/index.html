<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis</title>
  <link rel="stylesheet" href="/frontend/css/app.css">
  <link rel="stylesheet" href="/frontend/css/layout.css">
  <link rel="stylesheet" href="/frontend/css/components.css">
  <link rel="stylesheet" href="/frontend/css/chat.css">
  <link rel="stylesheet" href="/frontend/css/reports.css">
  <link rel="stylesheet" href="/frontend/css/tools.css">
  <link rel="stylesheet" href="/frontend/css/ask-aegis.css">
  <script src="/frontend/js/vendor/marked.min.js"></script>
  <script src="/frontend/js/vendor/purify.min.js"></script>
  <script src="/frontend/js/app.js" type="module"></script>
  <script src="/frontend/js/askAegis.js" type="module"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="/?view=overview" data-nav="overview" aria-label="Aegis overview">
          <img class="brand-icon" src="/frontend/assets/aegis-icon.png" alt="Aegis">
          <span class="brand-full">
            <img class="brand-full-icon" src="/frontend/assets/aegis-icon.png" alt="">
            <img class="brand-full-wordmark" src="/frontend/assets/aegis-wordmark.png" alt="Aegis">
          </span>
        </a>
      </div>
      <nav class="sidebar-nav" aria-label="Primary navigation">
        <a class="sidebar-link" href="/?view=overview" data-nav="overview" title="Overview">
          <span class="sidebar-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.5" y="2.5" width="6" height="6" rx="1"></rect>
              <rect x="11.5" y="2.5" width="6" height="6" rx="1"></rect>
              <rect x="2.5" y="11.5" width="6" height="6" rx="1"></rect>
              <rect x="11.5" y="11.5" width="6" height="6" rx="1"></rect>
            </svg>
          </span>
          <span class="sidebar-label">Overview</span>
        </a>
      </nav>
    </aside>
    <div class="app-body">
      <header class="topbar">
        <div class="topbar-search">
          <svg class="topbar-search-icon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="9" r="6"></circle>
            <line x1="17" y1="17" x2="13.4" y2="13.4"></line>
          </svg>
          <input type="text" class="topbar-search-input" id="topbar-search-input" placeholder="Search incidents, assets, indicators, or ask Aegis..." aria-label="Search incidents, assets, indicators, or ask Aegis">
          <span class="topbar-search-shortcut" aria-hidden="true">Ctrl K</span>
        </div>
        <div class="topbar-actions">
          <button class="topbar-icon-button" type="button" aria-label="Help">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="10" cy="10" r="7.5"></circle>
              <path d="M7.6 7.5a2.4 2.4 0 1 1 3.4 2.18c-.72.34-1 .78-1 1.32v.35"></path>
              <circle cx="10" cy="13.85" r="0.15" fill="currentColor" stroke="none"></circle>
            </svg>
          </button>
          <div class="topbar-divider" aria-hidden="true"></div>
          <button class="topbar-profile" type="button" aria-label="Account menu for Soong Yang Kho, SOC Analyst">
            <span class="topbar-avatar" aria-hidden="true">SK</span>
            <span class="topbar-profile-text">
              <span class="topbar-profile-name">Soong Yang Kho</span>
              <span class="topbar-profile-role">SOC Analyst</span>
            </span>
            <svg class="topbar-chevron" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="5.5 8 10 12.5 14.5 8"></polyline>
            </svg>
          </button>
        </div>
      </header>
      <main id="app-content" class="page" aria-live="polite">
        <div class="state-panel"><span class="spinner" aria-hidden="true"></span>Loading Aegis…</div>
      </main>
      <aside class="ask-aegis-panel" id="ask-aegis-panel" aria-label="Ask Aegis assistant">
        <header class="ask-aegis-header">
          <span class="ask-aegis-avatar" aria-hidden="true">
            <img src="/frontend/assets/aegis-avatar.png" alt="">
          </span>
          <div class="ask-aegis-heading">
            <h2 class="ask-aegis-title" id="ask-aegis-title">Ask Aegis</h2>
            <p class="ask-aegis-subtitle">Your AI SOC assistant</p>
            <p class="ask-aegis-context" id="ask-aegis-context"></p>
          </div>
        </header>
        <div class="ask-aegis-prompts" id="ask-aegis-prompts">
          <button type="button" data-prompt="Summarise this case">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5l1.1 3 3 1.1-3 1.1-1.1 3-1.1-3-3-1.1 3-1.1L8 1.5z"></path></svg>
            <span>Summarise case</span>
          </button>
          <button type="button" data-prompt="Show critical alerts">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.2 14.3 13H1.7L8 2.2z"></path><line x1="8" y1="6.6" x2="8" y2="9.6"></line><circle cx="8" cy="11.4" r="0.15" fill="currentColor" stroke="none"></circle></svg>
            <span>Critical alerts</span>
          </button>
          <button type="button" data-prompt="What needs approval?">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 8.5 6.3 11.8 13 4.5"></polyline></svg>
            <span>Needs approval</span>
          </button>
          <button type="button" data-prompt="Explain the latest alert">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.8" cy="6.8" r="4"></circle><line x1="9.7" y1="9.7" x2="13.5" y2="13.5"></line></svg>
            <span>Explain alert</span>
          </button>
        </div>
        <div class="ask-aegis-messages" id="ask-aegis-messages" aria-live="polite"></div>
        <form class="ask-aegis-composer" id="ask-aegis-composer">
          <input type="text" name="message" id="ask-aegis-input" maxlength="8000" autocomplete="off" placeholder="Ask Aegis anything..." aria-label="Ask Aegis anything">
          <button class="ask-aegis-send" type="submit" aria-label="Send message">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="3" y1="10" x2="17" y2="10"></line>
              <polyline points="11 4 17 10 11 16"></polyline>
            </svg>
          </button>
        </form>
      </aside>
    </div>
  </div>
</body>
</html>
